<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指北喵-我的技术小站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/webp" sizes="32x32" href="image/northcat.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="style.css">
</head>
<body class="selection:bg-sky-200 selection:text-sky-700">

<div id="app-wrapper">
    <div id="main-content" class="w-full max-w-7xl flex flex-col flex-grow space-y-5 md:space-y-7 xl:space-y-8">

        <header class="flex flex-col sm:flex-row justify-between items-center w-full pt-2">
            <div id="date-time-info" class="text-center sm:text-left mb-3 sm:mb-0 order-1 sm:order-none">
                <div id="current-time" class="font-semibold text-gray-700"></div>
                <div id="current-date" class="text-gray-500"></div>
            </div>
            <div id="quick-actions"
                 class="flex items-center space-x-2.5 mb-3 sm:mb-0 order-3 sm:order-none sm:ml-auto mr-0 sm:mr-4">
                <button id="toggle-focus-mode" title="专注模式" class="quick-action-btn">
                    <i class="fas fa-street-view fa-fw"></i> <span class="hidden md:inline ml-1">专注</span>
                </button>
            </div>
            <div id="weather-info"
                 class="text-base md:text-lg text-gray-600 text-center sm:text-right order-2 sm:order-none">
                <i class="fas fa-spinner fa-spin"></i> 加载天气中...
            </div>
        </header>

        <section id="search-wrapper" class="w-full">
            <form id="search-form"
                  class="search-form-container flex w-full max-w-3xl mx-auto items-center rounded-xl overflow-hidden">
                <div id="search-engine-icons-wrapper" class="flex items-center pl-2.5 sm:pl-3">
                    <button type="button" class="search-engine-btn-inline text-base md:text-lg" data-engine="baidu"
                            data-url="https://www.baidu.com/s" data-query="wd" title="百度">
                        <span class="baidu-text-icon">度</span>
                    </button>
                    <button type="button" class="search-engine-btn-inline text-base md:text-lg" data-engine="google"
                            data-url="https://www.google.com/search" data-query="q" title="Google">
                        <i class="fab fa-google fa-fw"></i>
                    </button>
                    <button type="button" class="search-engine-btn-inline text-base md:text-lg" data-engine="bing"
                            data-url="https://www.bing.com/search" data-query="q" title="Bing">
                        <i class="fab fa-microsoft fa-fw"></i>
                    </button>
                </div>
                <input type="text" id="search-input" name="q" placeholder="探索..."
                       class="search-input flex-grow py-3.5 md:py-4 px-3 sm:px-4 focus:outline-none h-full text-base md:text-lg">
                <button type="submit" class="search-submit-button font-semibold py-3.5 md:py-4 px-4 sm:px-5 h-full">
                    <i class="fas fa-search text-lg"></i>
                </button>
            </form>
            <div id="quote-section" class="mt-4 text-center">
                <p id="hitokoto-quote" class="px-4 py-1"></p>
            </div>
        </section>

        <section id="mid-content-blocks" class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6">
            <section id="tools-showcase" class="content-block rounded-2xl p-5 md:p-6">
                <h2 class="text-xl font-semibold text-gray-800 text-center sm:text-left">常用工具</h2>
                <nav id="tool-links"
                     class="grid grid-cols-2 xs:grid-cols-3 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-4">
                    <p class="tool-loading-message text-gray-400 col-span-full text-center py-4"><i
                            class="fas fa-spinner fa-spin mr-2"></i>工具加载中...</p>
                </nav>
            </section>
            <div id="todo-list-container" class="content-block rounded-2xl p-5 md:p-6 flex flex-col">
                <h2 class="text-xl font-semibold text-gray-800 flex items-center">
                    <i class="fas fa-list-check mr-2.5 text-sky-500 fa-fw"></i>待办事项
                </h2>
                <form id="todo-form" class="flex mb-4">
                    <input type="text" id="todo-input"
                           class="flex-grow p-2.5 border border-gray-300 rounded-l-lg transition-shadow text-sm"
                           placeholder="添加新任务...">
                    <button type="submit"
                            class="search-submit-button text-white font-semibold p-2.5 rounded-r-lg transition-colors">
                        <i class="fas fa-plus"></i> 添加
                    </button>
                </form>
                <ul id="todo-list" class="space-y-2.5 overflow-y-auto max-h-72 flex-grow pr-1">
                </ul>
            </div>
        </section>

        <section id="hot-topics-section" class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 flex-grow">
            <div class="content-block rounded-2xl p-5 md:p-6 flex flex-col">
                <h2 class="text-xl font-semibold text-gray-800 flex items-center">
                    <i class="fab fa-weibo mr-2.5 text-red-500 fa-fw"></i>微博热搜
                </h2>
                <div id="weibo-hot-content"
                     class="hot-list-container flex-grow overflow-y-auto pr-1.5 -mr-0.5 max-h-[20rem] sm:max-h-80 xl:max-h-96">
                    <p class="text-center p-4 text-gray-500"><i class="fas fa-spinner fa-spin"></i> 加载中...</p>
                </div>
            </div>
            <div class="content-block rounded-2xl p-5 md:p-6 flex flex-col">
                <h2 class="text-xl font-semibold text-gray-800 flex items-center">
                    <i class="fas fa-bolt-lightning mr-2.5 text-yellow-500 fa-fw"></i>少数派热榜
                </h2>
                <div id="sspai-hot-content"
                     class="hot-list-container flex-grow overflow-y-auto pr-1.5 -mr-0.5 max-h-[20rem] sm:max-h-80 xl:max-h-96">
                    <p class="text-center p-4 text-gray-500"><i class="fas fa-spinner fa-spin"></i> 加载中...</p>
                </div>
            </div>
            <div class="content-block rounded-2xl p-5 md:p-6 flex flex-col">
                <h2 class="text-xl font-semibold text-gray-800 flex items-center">
                    <i class="fab fa-github mr-2.5 text-gray-700 fa-fw"></i>HelloGitHub
                </h2>
                <div id="github-hot-content"
                     class="hot-list-container flex-grow overflow-y-auto pr-1.5 -mr-0.5 max-h-[20rem] sm:max-h-80 xl:max-h-96">
                    <p class="text-center p-4 text-gray-500"><i class="fas fa-spinner fa-spin"></i> 加载中...</p>
                </div>
            </div>
        </section>
        <footer id="main-footer"
                class="text-center text-sm text-gray-500 py-3 mt-auto flex flex-wrap items-center justify-center gap-x-2 gap-y-1 px-2">
            <span>简约导航 &copy; <span id="current-year"></span>. Crafted with <i
                    class="fas fa-mug-saucer text-orange-400 hover:text-orange-500 transition-colors"></i>.</span>
            <span class="hidden sm:inline">|</span>
            <span class="beian-info flex items-center justify-center space-x-1">
                <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer"
                   class="hover:text-sky-500 transition-colors">浙ICP备19019390号</a>
                <span class="mx-1">|</span>
                <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=33099802000427" target="_blank"
                   rel="noopener noreferrer" class="hover:text-sky-500 transition-colors flex items-center">
                    <img loading="lazy" class="inline-block align-middle mr-1"
                         src="image/beian.webp" alt="公网安备图标" width="16" height="16">
                    浙公网安备 33099802000427号
                </a>
            </span>
        </footer>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
